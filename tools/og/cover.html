<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>podcast cover</title>
<!-- 1400x1400 show cover -> images/cover.png. The painting (images/cover-art.png) carries no text,
     so the title is set here, in the spaced capitals the episode covers use. -->
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1400px;height:1400px;overflow:hidden;background:#0b0d14}
.c{position:relative;width:1400px;height:1400px;background:url(../../images/cover-art.png) center/cover}
h1{position:absolute;left:0;right:0;top:118px;margin:0;text-align:center;color:#f3e9d8;
  font:300 112px/1 'Josefin Sans',sans-serif;letter-spacing:.28em;padding-left:.28em}
</style>
</head>
<body><div class="c"><h1>THE AIGS POD</h1></div></body>
</html>
